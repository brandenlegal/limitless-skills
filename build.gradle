plugins {
	id 'java'
	id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
}

version = "1.0.0"
group = "com.branden.limitskills"

repositories {
	mavenCentral()
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"limitskills" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:26.3"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:0.19.5"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.160.5+26.3"

	// ui-lib (current UI, proven in Enchants v2.5.3)
	modImplementation "maven.modrinth:uilib:22.1.0+26.3"

	// Note: owo-lib will be added when migrating UI from ui-lib
	// owo-lib 0.13.1+26.3: https://github.com/roggy666/owo-lib-26.3/releases/tag/Fabric-26.3
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.name}" }
	}
}
